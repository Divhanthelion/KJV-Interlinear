name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  # Weekly, so a correction published upstream at eBible.org shows up here
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

# The 1769 source the KJV files were made from, pinned so an eBible.org outage
# or an upstream change fails distinctly instead of breaking every PR.
env:
  KJV_VPL_SHA256: 3c611764ee4c66248681f83f1ce5689e77a9c50a590fc3241584259c1b9183b5
  KJV_USFM_SHA256: 0e0359e9e488582a72c86800f227839ecb16dada7bb5ba316509d374c59e559a

jobs:
  test:
    name: Data and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the eBible.org source texts (pinned)
        run: |
          fetch() { # name sha
            curl -fsSL --retry 3 "https://ebible.org/Scriptures/$1" -o "$RUNNER_TEMP/$1"
            echo "$2 *$RUNNER_TEMP/$1" | sha256sum -c - || {
              echo "::error::$1 changed upstream (or the download was corrupted)."
              echo "::error::If eBible.org published a correction, review it and update the pinned SHA-256 in ci.yml."
              exit 1
            }
          }
          fetch eng-kjv_vpl.zip  "$KJV_VPL_SHA256"
          fetch eng-kjv_usfm.zip "$KJV_USFM_SHA256"
          unzip -o "$RUNNER_TEMP/eng-kjv_vpl.zip" eng-kjv_vpl.txt -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/usfm" && unzip -o "$RUNNER_TEMP/eng-kjv_usfm.zip" -d "$RUNNER_TEMP/usfm"
      # Checks every character of the KJV, every original-language word, lexicon link, and red-letter span
      - run: cargo test --release -p kjv-core -p kjv-ai -p kjv-devserver
        env:
          KJV_SOURCE: ${{ runner.temp }}/eng-kjv_vpl.txt
          KJV_USFM: ${{ runner.temp }}/usfm

  ui:
    name: UI script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every module
        run: for f in ui/js/*.js; do node --check "$f" || exit 1; done

  ui-smoke:
    name: UI smoke test (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p kjv-devserver
      - name: Start the preview server and a stand-in model
        run: |
          python3 tests/ui/mock_llm.py 8765 &
          ./target/release/kjv-devserver 1420 > devserver.log 2>&1 &
          for i in $(seq 60); do curl -sf -X POST -H 'Content-Type: application/json' localhost:1420/api/books -d '{}' > /dev/null && exit 0; sleep 1; done
          cat devserver.log; exit 1
      - run: node tests/ui/smoke.mjs google-chrome

  build:
    name: Build app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo build -p kjv-interlinear

  # Mobile cfg branches (secrets, clipboard) break silently without a PR-time check
  mobile-check:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: aarch64-apple-ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Point cc at the preinstalled NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDKBIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$NDKBIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDKBIN/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check --lib -p kjv-interlinear --target ${{ matrix.target }}
