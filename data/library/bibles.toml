# The translations in the library, in the order the app lists them.
#
# Every text comes from eBible.org (https://ebible.org), as USFM, and is checked word
# for word against eBible's own plain-text edition of the same translation. Licences
# and credit lines were checked against each translation's eBible copyright page on
# 2026-10-01/02. The app never alters a text and never charges money, which satisfies
# every licence below, including NonCommercial and NoDerivatives.
#
# Fields:
#   id          our id, used in data/library/bibles/<id>/ and in the app
#   abbr        the abbreviation shown beside verses
#   name, year  as the translation is known
#   group       how the picker groups translations
#   ebible      eBible.org translation id (source: <ebible>_usfm.zip)
#   licence     pd | cc-by-4.0 | cc-by-sa-4.0 | cc-by-nd-4.0 | cc-by-nc-nd-4.0 | net
#   credit      the copyright / credit line the licence requires (shown in the app)
#   about       one or two sentences for the picker
#   heading_markers  paragraph markers this edition uses for headings (see usfm::Options)

