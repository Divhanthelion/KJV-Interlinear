[package]
name = "kjv-interlinear"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "KJV Bible study app with Hebrew and Greek interlinear support"
repository = "https://github.com/Divhanthelion/KJV-Interlinear"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
bincode = "1.3"

# glow (OpenGL) everywhere it exists; iOS has no glutin backend, so it gets
# the wgpu (Metal) renderer instead. Resolver v2 keeps these per-target.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu"] }

# No clipboard backend on mobile; egui's own clipboard is used there instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3.4"

[package.metadata.bundle]
name = "KJV Interlinear"
identifier = "com.divhanthelion.kjv-interlinear"
icon = ["icon.png"]
resources = ["new_testament", "old_testament", "data", "icon.png", "NOTICE", "LICENSE"]
short_description = "KJV Bible reader with Hebrew/Greek interlinear"
long_description = """
A native KJV Bible study app with Hebrew and Greek interlinear text,
Strong's concordance, lexicon lookups, bookmarks, and themes.
KJV text: the 1769 standard text (public domain); original-language data from STEP Bible.
"""
