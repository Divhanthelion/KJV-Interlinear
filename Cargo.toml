[workspace]
resolver = "3"
members = ["crates/core", "crates/devserver", "app"]

[profile.release]
lto = "thin"
codegen-units = 1

# The app's build script parses ~110 MB of source data; optimize it even in dev builds
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
