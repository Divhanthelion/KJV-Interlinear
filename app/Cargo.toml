[package]
name = "kjv-interlinear"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "KJV Bible study app with Hebrew and Greek interlinear"
repository = "https://github.com/Divhanthelion/KJV-Interlinear"
publish = false

[lib]
# staticlib/cdylib are needed for the iOS and Android builds
name = "kjv_interlinear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
kjv-core = { path = "../crates/core" }
zstd = "0.13"

[dependencies]
kjv-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ruzstd = "0.8"
