[package]
name = "kjv-library"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Translations, commentaries, and cross-references for KJV Interlinear: parsing, storage, and lookup"
publish = false

[dependencies]
ruzstd = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", optional = true }

[features]
# Packing data/library/ into an archive (build scripts only)
build = ["dep:toml"]

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[[test]]
name = "library"
required-features = ["build"]
