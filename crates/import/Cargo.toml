[package]
name = "kjv-import"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Builds data/library/ from pinned upstream sources (see docs/LIBRARY.md)"
publish = false

[dependencies]
kjv-library = { path = "../library" }
kjv-sword = { path = "../sword" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[dev-dependencies]
serde_json = "1"
